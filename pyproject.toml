[project]
name = "slackops-devops-agent"
version = "0.0.0"
description = "Slack-controlled DevOps agent — Claude Code Headless as a remote operations engineer (least-privilege + injection defense + OTel)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "slack-bolt>=1.18",
    "boto3>=1.34",
    "structlog>=24.1",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "mcp>=1.0",  # propose_job MCP 서버(에이전트 control plane) — app.mcp_server 가 lazy import
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "moto[dynamodb]>=5.0",
]

[project.scripts]
slackops-devops-agent = "app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

# 미설치(lazy import) / stub 부재 모듈 한정 완화 — overnight 게이트(mypy src) green 전제.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "slack_bolt.*", "fastapi.*", "opentelemetry.exporter.*", "mcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.main", "app.mcp_server"]
disallow_untyped_decorators = false  # fastapi/FastMCP 데코레이터가 Any 로 풀림

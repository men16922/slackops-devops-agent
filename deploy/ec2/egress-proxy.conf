# SlackOps agent egress proxy — localhost callers may CONNECT only to the explicit
# SaaS/AWS destinations required by the runtime. The agent systemd units deny every
# non-loopback IP, so this proxy is the single outbound network boundary.

http_port 127.0.0.1:3128

acl localhost src 127.0.0.1/32 ::1
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
acl to_localhost dst 127.0.0.0/8 ::1
acl to_linklocal dst 169.254.0.0/16 fe80::/10

# Slack Socket Mode/API, Claude Code, GitHub/git, fixed AWS adapters and Terraform
# review dependency resolution. `amazonaws.com` is constrained further by the split
# runtime IAM role; no S3/SSM-secret/write permissions are present in that role.
acl slackops_allowed dstdomain .slack.com .slack-edge.com .slack-msgs.com .anthropic.com .github.com .githubusercontent.com .githubassets.com .amazonaws.com registry.terraform.io .terraform.io .hashicorp.com

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny to_localhost
http_access deny to_linklocal
http_access allow localhost slackops_allowed
http_access deny all

cache deny all
cache_mem 0
access_log stdio:/var/log/squid/access.log
